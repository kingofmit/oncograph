[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "oncograph"
version = "0.1.1"
description = "Python client for the OncoGraph federated cancer data discovery API"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.9"
authors = [
    {name = "Ahmed Allem"},
    {name = "Andrea Dykes"},
    {name = "Freedom Cheteni-Mandela"},
    {name = "Paulina Valenzuela"},
]
dependencies = ["requests>=2.28.0"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
]

[project.urls]
Homepage = "https://github.com/kingofmit/oncograph"
Documentation = "https://github.com/kingofmit/oncograph#readme"

[tool.setuptools.packages.find]
include = ["oncograph*"]
